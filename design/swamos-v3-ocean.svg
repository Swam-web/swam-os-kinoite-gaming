<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- SwamOS v3 « Océan » — badge aqua, S-vague blanc avec écume (swam = swim) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="v3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.6" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#134e6f"/>
    </linearGradient>
    <radialGradient id="v3glow" cx="0.5" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#v3bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#v3glow)"/>

  <!-- S-vague : deux ondulations successives -->
  <path d="M 372 178
           C 330 130, 268 122, 222 148
           C 176 174, 176 226, 224 246
           C 272 266, 336 272, 336 322
           C 336 372, 282 396, 230 388
           C 190 382, 160 358, 150 330"
        fill="none" stroke="#ffffff" stroke-width="50" stroke-linecap="round"/>

  <!-- écume -->
  <circle cx="140" cy="180" r="16" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="112" cy="222" r="10" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="128" cy="150" r="8" fill="#ffffff" fill-opacity="0.6"/>

  <!-- queue de vague -->
  <path d="M 150 330 C 190 358, 240 372, 292 366" fill="none" stroke="#ffffff"
        stroke-width="14" stroke-linecap="round" stroke-opacity="0.35"/>
</svg>
