<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- SwamOS v2 « Neon » — hexagone sombre, S néon cyan/magenta avec halo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="v2accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2ad4"/>
    </linearGradient>
    <linearGradient id="v2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1024"/>
      <stop offset="1" stop-color="#131735"/>
    </linearGradient>
    <filter id="v2halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- hexagone -->
  <path d="M 256 24 L 462 142 L 462 370 L 256 488 L 50 370 L 50 142 Z"
        fill="url(#v2bg)" stroke="url(#v2accent)" stroke-width="10"
        stroke-opacity="0.9"/>

  <!-- S néon avec halo -->
  <g filter="url(#v2halo)">
    <path d="M 362 170
             C 362 120, 304 96, 256 96
             C 190 96, 152 138, 152 196
             C 152 254, 216 264, 256 274
             C 298 284, 360 294, 360 350
             C 360 404, 308 436, 256 436
             C 204 436, 150 412, 150 356"
          fill="none" stroke="url(#v2accent)" stroke-width="52"
          stroke-linecap="round"/>
  </g>

  <!-- éclats circuit -->
  <path d="M 92 128 L 132 128 L 156 152" fill="none" stroke="#00e5ff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 420 384 L 380 384 L 356 360" fill="none" stroke="#ff2ad4" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
