# GameMode : renice=-10 (gamemode.ini renice=10, valeur négée) exige
# CAP_SYS_NICE — sinon le renice échoue silencieusement.
# L'alternative upstream (ajouter l'utilisateur au groupe « gamemode »)
# est inapplicable au build d'image : aucun utilisateur à ce stade.
[Service]
AmbientCapabilities=CAP_SYS_NICE
