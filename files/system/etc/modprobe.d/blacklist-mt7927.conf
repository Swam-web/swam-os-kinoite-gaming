# MT7927 (WiFi+BT MediaTek) — RETIRÉ de l'image : suspect principal de la
# corruption de profil utilisateur (10 CVE memory-safety actives sur
# mt7925/mt76 ; machine-spécifique — l'install AMD de contrôle est saine).
# Isolement complet : le driver in-tree mt7925e est également blacklisté
# (la carte est physiquement présente, sans driver elle ne fait aucune DMA).
# Ré-activation quand le driver est sain :
#   sudo rm /etc/modprobe.d/blacklist-mt7927.conf   (+ rétablir mt7927.sh)
blacklist mt7925e
blacklist btusb
blacklist mt7925u
